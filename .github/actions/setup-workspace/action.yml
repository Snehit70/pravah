name: Set up workspace
description: Install the pinned Bun and the workspace dependencies from the lockfile
inputs:
  bun-version:
    description: Bun version to install
    default: 1.3.3
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    # No ~/.bun/install/cache restore: a cold `bun install --frozen-lockfile`
    # finishes faster than restoring the ~250 MB cache archive.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
