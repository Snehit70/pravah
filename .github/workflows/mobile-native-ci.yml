name: Mobile native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  BUN_VERSION: 1.3.3
  APP_VARIANT: e2e
  PRAVAH_E2E: '1'
  EXPO_PUBLIC_MOBILE_RELEASE_VERSION: 0.0.0
  MOBILE_NATIVE_RUNTIME: native-e2e
  EXPO_PUBLIC_CONVEX_URL: https://native-ci.invalid.convex.cloud
  EXPO_NO_TELEMETRY: '1'

jobs:
  native-workflows:
    name: Android native workflows and performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check native dependency and Expo config compatibility
        working-directory: apps/mobile
        run: bunx expo-doctor@1.21.5
      - name: Prepare fresh isolated Android project
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform android --no-install
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest)
          # Local provider fixture only. Production app configuration is unchanged.
          tree.getroot().find('application').set('{http://schemas.android.com/apk/res/android}usesCleartextTraffic', 'true')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
      - name: Build release fixture APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output /tmp/maestro.zip
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/checksums_sha256.txt --output /tmp/maestro-checksums.txt
          cd /tmp
          sha256sum --check --ignore-missing maestro-checksums.txt
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native workflows and performance budgets
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/mobile-performance/run-native-ci.sh
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-native-evidence
          path: artifacts/mobile-native
          if-no-files-found: warn
          retention-days: 14
  persistence-benchmark:
    name: Mobile persistence performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/mobile-performance/persistence-benchmark.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-persistence-benchmark
          path: artifacts/mobile-performance
