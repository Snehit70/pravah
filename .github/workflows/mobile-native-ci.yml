name: Mobile native CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Off the busy top/quarter-hour slots, which GitHub delays the most (runs
    # queued for 03:15 started 5-8 h late). Expect some drift regardless.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      force_clean:
        description: Recompile native code without build-cache reuse
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mobile-native-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  BUN_VERSION: 1.3.3
  APP_VARIANT: e2e
  PRAVAH_E2E: '1'
  EXPO_PUBLIC_MOBILE_RELEASE_VERSION: 0.0.0
  MOBILE_NATIVE_RUNTIME: native-e2e
  EXPO_PUBLIC_CONVEX_URL: https://native-ci.invalid.convex.cloud
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  plan:
    name: Select mobile validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mobile_required: ${{ steps.context.outputs.mobile_required }}
      force_clean: ${{ steps.context.outputs.force_clean }}
      tree: ${{ steps.context.outputs.tree }}
      native_fingerprint: ${{ steps.fingerprint.outputs.native_fingerprint }}
      cache_key: ${{ steps.fingerprint.outputs.cache_key }}
      reused: ${{ steps.reuse.outputs.reused }}
      producer_run: ${{ steps.reuse.outputs.producer_run }}
      artifact_name: ${{ steps.reuse.outputs.artifact_name }}
      release_contract: ${{ steps.context.outputs.release_contract }}
      context_artifact: ${{ steps.context.outputs.context_artifact }}
      warm: ${{ steps.base-lookup.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: context
        run: bun scripts/mobile-ci/context.ts
      - if: steps.context.outputs.mobile_required == 'true'
        run: bun install --frozen-lockfile
      - id: fingerprint
        if: steps.context.outputs.mobile_required == 'true'
        run: bun scripts/mobile-ci/fingerprint.ts
      - id: reuse
        if: steps.context.outputs.mobile_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/mobile-ci/reuse.ts
      # Warm path: when a native base for this fingerprint is cached, each device
      # job repacks the JS bundle itself while its emulator boots, and the
      # separate prepare job is skipped.
      - id: base-lookup
        if: steps.context.outputs.mobile_required == 'true' && steps.reuse.outputs.reused != 'true' && steps.context.outputs.force_clean != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ steps.fingerprint.outputs.cache_key }}
          lookup-only: true
      - name: Retrieve the validated PR base
        if: steps.reuse.outputs.promote_base == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reuse.outputs.producer_run }}
          name: ${{ steps.reuse.outputs.artifact_name }}
          path: artifacts/mobile-native-base
      - name: Verify promoted base
        if: steps.reuse.outputs.promote_base == 'true'
        env:
          EXPECTED_APK_SHA256: ${{ steps.reuse.outputs.apk_sha256 }}
        run: |
          bun scripts/mobile-ci/native-base.ts assert
          bun scripts/mobile-ci/verify-apk.ts fixture artifacts/mobile-native-base/base.apk
      - name: Make the trusted base available to future PRs
        if: steps.reuse.outputs.promote_base == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ steps.fingerprint.outputs.cache_key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.context.outputs.context_artifact }}
          path: artifacts/mobile-ci
          retention-days: 14

  prepare:
    name: Prepare current mobile test APK
    needs: plan
    if: needs.plan.outputs.mobile_required == 'true' && needs.plan.outputs.reused != 'true' && needs.plan.outputs.warm != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.prepared.outputs.artifact_name }}
      apk_file: ${{ steps.prepared.outputs.apk_file }}
      apk_sha256: ${{ steps.prepared.outputs.apk_sha256 }}
      preparation: ${{ steps.mode.outputs.preparation }}
      image: ${{ steps.mode.outputs.image }}
    env:
      EXPO_PUBLIC_NATIVE_CI_SOURCE: ${{ needs.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.context_artifact }}
          path: artifacts/mobile-ci
      - run: bun install --frozen-lockfile
      - name: Check SDK and native dependencies
        run: bash scripts/mobile-ci/expo-doctor.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - id: base-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ needs.plan.outputs.cache_key }}
          lookup-only: ${{ needs.plan.outputs.force_clean == 'true' }}
      - id: base
        run: bun scripts/mobile-ci/native-base.ts check
      - id: mode
        env:
          BASE_VALID: ${{ steps.base.outputs.valid }}
          FORCE_CLEAN: ${{ needs.plan.outputs.force_clean }}
        run: |
          bun -e 'const fs=require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "preparation="+(process.env.BASE_VALID==="true"&&process.env.FORCE_CLEAN!=="true"?"repack":"build")+"\nimage="+(process.env.ImageVersion??"unknown")+"\n")'
      # One ~1.9 GB entry per native fingerprint. Keying on the commit as well
      # saved a fresh copy on every build and pushed the repo against the 10 GB
      # Actions cache cap.
      - id: gradle-cache
        if: steps.mode.outputs.preparation == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mobile-gradle-${{ runner.os }}-${{ needs.plan.outputs.native_fingerprint }}
          restore-keys: |
            mobile-gradle-${{ runner.os }}-
      - name: Compile a native base when required
        if: steps.mode.outputs.preparation == 'build'
        timeout-minutes: 30
        env:
          FORCE_CLEAN: ${{ needs.plan.outputs.force_clean }}
          EXPO_PUBLIC_NATIVE_CI_SOURCE: '0000000000000000000000000000000000000000'
        run: bash scripts/mobile-ci/build-base.sh
      # A forced clean build runs with --no-build-cache, so its Gradle home has no
      # build outputs worth keeping. Saving it under the fingerprint key would
      # pin a cache that makes every later build for that fingerprint cold.
      - name: Retain reusable Gradle dependencies
        if: steps.mode.outputs.preparation == 'build' && steps.gradle-cache.outputs.cache-hit != 'true' && needs.plan.outputs.force_clean != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Embed and verify the current source bundle
        timeout-minutes: 10
        run: bash scripts/mobile-ci/repack.sh
      - id: prepared
        run: bun scripts/mobile-ci/native-base.ts prepared
      - name: Cache this profile's native base
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ needs.plan.outputs.cache_key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepared.outputs.artifact_name }}
          path: artifacts/mobile-native-base
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-native-build-evidence-${{ github.run_attempt }}
          path: artifacts/mobile-native-build
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: Android native workflows
    needs: [plan, prepare]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.prepare.result == 'success' ||
       (needs.prepare.result == 'skipped' && needs.plan.outputs.warm == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_NATIVE_CI_SOURCE: ${{ needs.plan.outputs.tree }}
    outputs:
      image: ${{ steps.device.outputs.image }}
      artifact_name: ${{ steps.device.outputs.artifact_name }}
      apk_file: ${{ steps.device.outputs.apk_file }}
      apk_sha256: ${{ steps.device.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.context_artifact }}
          path: artifacts/mobile-ci
      - if: needs.plan.outputs.warm != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/mobile-native-apk
      - if: needs.plan.outputs.warm == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ needs.plan.outputs.cache_key }}
          fail-on-cache-miss: true
      - if: needs.plan.outputs.warm == 'true'
        run: bun scripts/mobile-ci/native-base.ts assert
      - id: device
        uses: ./.github/actions/mobile-device
        with:
          suite: workflows
          apk-sha256: ${{ needs.prepare.outputs.apk_sha256 }}
          prepare: ${{ needs.plan.outputs.warm }}
          doctor: true
      # Warm path: this job is the APK producer that a later merge promotes.
      - if: needs.plan.outputs.warm == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.device.outputs.artifact_name }}
          path: artifacts/mobile-native-base
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-native-workflows-evidence-${{ github.run_attempt }}
          path: artifacts/mobile-native
          retention-days: 14
          if-no-files-found: warn

  performance:
    name: Android startup and scroll performance
    needs: [plan, prepare]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.prepare.result == 'success' ||
       (needs.prepare.result == 'skipped' && needs.plan.outputs.warm == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_NATIVE_CI_SOURCE: ${{ needs.plan.outputs.tree }}
    outputs:
      image: ${{ steps.device.outputs.image }}
      artifact_name: ${{ steps.device.outputs.artifact_name }}
      apk_file: ${{ steps.device.outputs.apk_file }}
      apk_sha256: ${{ steps.device.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.plan.outputs.context_artifact }}
          path: artifacts/mobile-ci
      - if: needs.plan.outputs.warm != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/mobile-native-apk
      - if: needs.plan.outputs.warm == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/mobile-native-base
          key: ${{ needs.plan.outputs.cache_key }}
          fail-on-cache-miss: true
      - if: needs.plan.outputs.warm == 'true'
        run: bun scripts/mobile-ci/native-base.ts assert
      - id: device
        uses: ./.github/actions/mobile-device
        with:
          suite: performance
          apk-sha256: ${{ needs.prepare.outputs.apk_sha256 }}
          prepare: ${{ needs.plan.outputs.warm }}
          doctor: false
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-native-performance-evidence-${{ github.run_attempt }}
          path: artifacts/mobile-native
          retention-days: 14
          if-no-files-found: warn

  release-contract:
    name: Published APK contract
    needs: plan
    if: needs.plan.outputs.release_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Bun installation of the pinned release CLI
        run: |
          bun add --global eas-cli@24.6.0
          eas --version
      - name: Verify the known published APK without launching it
        env:
          RELEASE_VERSION: 3.0.34
          MOBILE_NATIVE_RUNTIME: native-7
        run: |
          mkdir -p artifacts/release-contract
          curl --fail --location --retry 3 https://github.com/Snehit70/pravah/releases/download/mobile-v3.0.34/pravah-3.0.34.apk --output artifacts/release-contract/pravah-3.0.34.apk
          curl --fail --location --retry 3 https://github.com/Snehit70/pravah/releases/download/mobile-v3.0.34/pravah-3.0.34.apk.sha256 --output artifacts/release-contract/pravah-3.0.34.apk.sha256
          (cd artifacts/release-contract && sha256sum --check pravah-3.0.34.apk.sha256)
          bun scripts/mobile-ci/verify-apk.ts release artifacts/release-contract/pravah-3.0.34.apk

  gate:
    name: Android native workflows and performance
    if: always()
    needs: [plan, prepare, workflows, performance, persistence-benchmark, release-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.result == 'success'
        with:
          name: ${{ needs.plan.outputs.context_artifact }}
          path: artifacts/mobile-ci
      - name: Enforce the complete quality gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence-benchmark.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          WARM: ${{ needs.plan.outputs.warm }}
          PREPARE_IMAGE: ${{ needs.prepare.outputs.image || needs.workflows.outputs.image }}
          WORKFLOWS_IMAGE: ${{ needs.workflows.outputs.image }}
          PERFORMANCE_IMAGE: ${{ needs.performance.outputs.image }}
          REUSED: ${{ needs.plan.outputs.reused }}
          APK_ARTIFACT: ${{ needs.prepare.outputs.artifact_name || needs.workflows.outputs.artifact_name }}
          APK_FILE: ${{ needs.prepare.outputs.apk_file || needs.workflows.outputs.apk_file }}
          APK_SHA256: ${{ needs.prepare.outputs.apk_sha256 || needs.workflows.outputs.apk_sha256 }}
          PERFORMANCE_APK_SHA256: ${{ needs.performance.outputs.apk_sha256 }}
          APK_PREPARATION: ${{ needs.prepare.outputs.preparation || 'repack-on-device-runner' }}
        run: bun scripts/mobile-ci/result.ts
      - if: needs.plan.outputs.mobile_required == 'true' && needs.plan.outputs.reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-native-result-${{ github.run_attempt }}
          path: artifacts/mobile-ci/result.json
          retention-days: 14
          if-no-files-found: error

  persistence-benchmark:
    name: Mobile persistence performance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/mobile-performance/persistence-benchmark.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-persistence-benchmark
          path: artifacts/mobile-performance
