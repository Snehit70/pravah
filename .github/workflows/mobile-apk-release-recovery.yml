name: Recover Mobile APK Release

on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Existing mobile release attempt to finalize
        required: true
        type: string
      expected_revision:
        description: Release-control revision reserved by the original run
        required: true
        type: string
      github_tag:
        description: Draft GitHub release tag containing the verified APK
        required: true
        type: string
      artifact_url:
        description: APK asset URL from the draft GitHub release
        required: true
        type: string
      checksum_url:
        description: SHA-256 asset URL from the draft GitHub release
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.3
  MOBILE_CONVEX_URL: https://befitting-swan-125.eu-west-1.convex.cloud

jobs:
  finalize:
    name: Stage existing APK and finalize ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Stage the existing verified assets
        env:
          CONVEX_URL: ${{ env.MOBILE_CONVEX_URL }}
          MOBILE_RELEASE_DEPLOY_SECRET: ${{ secrets.MOBILE_RELEASE_DEPLOY_SECRET }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          GITHUB_TAG: ${{ inputs.github_tag }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          CHECKSUM_URL: ${{ inputs.checksum_url }}
        run: bun scripts/mobile-release/release-command.ts stage
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.github_tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Publish the reserved release ledger entry
        env:
          CONVEX_URL: ${{ env.MOBILE_CONVEX_URL }}
          MOBILE_RELEASE_DEPLOY_SECRET: ${{ secrets.MOBILE_RELEASE_DEPLOY_SECRET }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: bun scripts/mobile-release/release-command.ts publish
