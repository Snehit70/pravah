name: Task Inspector Diagnostics

on:
  pull_request:

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.3

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Clone pull request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth 1 --branch "$HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply focused fixes
        working-directory: repo
        run: python .github/task-inspector-fix.py

      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile >/dev/null

      - name: Verify focused checks
        working-directory: repo
        shell: bash
        run: |
          set +e
          (cd apps/mobile && bun run typecheck:fast) > /tmp/typecheck.log 2>&1
          type_status=$?
          bun run lint > /tmp/lint.log 2>&1
          lint_status=$?
          echo "=== MOBILE TYPECHECK ==="
          grep -E 'error TS|^src/' /tmp/typecheck.log || true
          echo "=== LINT ERRORS ==="
          grep -E '^/|^[[:space:]]+[0-9]+:[0-9]+[[:space:]]+error' /tmp/lint.log || true
          if [ "$lint_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            exit 1
          fi

      - name: Commit focused fixes
        working-directory: repo
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/EditTaskSheet.tsx \
                  apps/mobile/src/test/editTaskSheet.test.tsx \
                  apps/mobile/src/test/completedTaskSheet.test.tsx
          git commit -m "fix(mobile): satisfy task inspector checks"
          git push origin "HEAD:${HEAD_REF}"
