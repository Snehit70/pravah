name: Task Inspector Diagnostics

on:
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.3

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Clone pull request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git clone --depth 1 --branch "$HEAD_REF" https://github.com/${{ github.repository }}.git repo

      - name: Install dependencies
        working-directory: repo
        run: bun install --frozen-lockfile >/dev/null

      - name: Print focused diagnostics
        working-directory: repo
        shell: bash
        run: |
          set +e
          bun run lint > /tmp/lint.log 2>&1
          lint_status=$?
          (cd apps/mobile && bun run typecheck:fast) > /tmp/typecheck.log 2>&1
          type_status=$?
          echo "=== LINT OUTPUT ==="
          cat /tmp/lint.log
          echo "=== MOBILE TYPECHECK OUTPUT ==="
          cat /tmp/typecheck.log
          if [ "$lint_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            exit 1
          fi
