name: Task Inspector Review Fix

on:
  pull_request:

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.3

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Apply review fixes
        run: python .github/task-inspector-review-fix.py

      - name: Install dependencies
        run: bun install --frozen-lockfile >/dev/null

      - name: Validate
        run: |
          bun run lint
          (cd apps/mobile && bun run typecheck:fast)
          (cd apps/mobile && bun run test)

      - name: Commit review fixes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components/CompletedTaskSheet.tsx \
                  apps/mobile/src/components/EditTaskSheet.tsx
          git commit -m "fix(mobile): address task inspector review"
          git push origin "HEAD:${HEAD_REF}"
