name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Content-hashed ESLint cache: only files whose bytes changed are re-linted.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.js') }}-

      - name: Lint
        run: bun run lint

  typecheck-root:
    name: Typecheck root
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Typecheck root
        run: bun run typecheck:fast

  typecheck-mobile:
    name: Typecheck mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: bun run typecheck:fast

  test-root:
    name: Test root
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test root
        run: bun run test:run

      - name: Test actual-byte metrics collector and mobile CI routing
        run: bun test scripts/observability scripts/mobile-ci

      - name: Test native startup transport handling
        run: python -m unittest discover -s scripts/mobile-performance -p 'test_*.py'

  test-mobile:
    name: Test mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test mobile
        working-directory: apps/mobile
        run: bun run test

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `bun run build` is `tsc -b && vite build`; "Typecheck root" already runs
      # the same project references, so CI only bundles here.
      - name: Build web
        run: bunx vite build

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Smoke test bundled CLI
        run: bun packages/cli/dist/pravah.js --version
